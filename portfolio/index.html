<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajinesh Pratap Singh — Portfolio</title>
    <meta name="description" content="Personal portfolio of Ajinesh Pratap Singh, an AI/ML and full-stack software engineer specializing in end-to-end AI/ML systems and production-ready applications.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('portfolio-theme') || 
                    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'light') {
          document.body.className = 'bg-[#fbfbf8] text-slate-900 min-h-screen font-sans selection:bg-indigo-500 selection:text-white antialiased transition-colors duration-300';
        }
      })();
    </script>
</head>
<body class="bg-[#0a0a0f] text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white antialiased transition-colors duration-300">
    <div id="portfolio-root"></div>
    <script type="module" src="/src/portfolio.tsx"></script>
</body>
</html>
